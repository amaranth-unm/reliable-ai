title: Reliable AI for Humanists
tagline: An AI brown bag series from Amaranth
description: "A brown bag workshop series on getting useful, trustworthy results from generative AI — techniques, habits, and workflows that complement humanities expertise instead of replacing it. Hosted by Amaranth, UNM's digital humanities and public scholarship studio."

baseurl: /reliable-ai/
repository: jeseyfried/reliable-ai

theme_css: rubric
# Site search (the magnifying glass in the nav). Off: the nav already reaches
# every page, and a handful of pages doesn't need a search box.
search: false

# Build unlisted previews; all discovery paths filter published: false.
unpublished: true

plugins:
  - jekyll-sitemap
  # Old URLs from before each session got its own folder (redirect_from).
  - jekyll-redirect-from

exclude:
  - Dockerfile
  - SESSION-STYLE.md
  - workshop-drafts
  - docker-compose.yaml
  - scripts
  - README.md
  - MAINTAINING.md
  - XANTHAN_CHANGELOG.md
  - Gemfile
  - Gemfile.lock
