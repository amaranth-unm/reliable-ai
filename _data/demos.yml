- id: assignment-student-run
  session: editorial-assistant
  strategy: 3
  label: "The student's reading"
  run: 'prompt id="assignment-student"'
  tool: Claude Sonnet 5.5
  date: '2026-10-08'
  note: "A fresh incognito conversation at the default settings, with only the workshop copy of the assignment attached. The prompt was sent as written."
  text: |
    ## Reading the assignment as a first-year student

    ### What I would do first

    The assignment assumes I’ve finished Part 1, and it says so near the top: “You’ve already completed the AI draft and critique in Part 1.” So my first move is to locate my AI essay and my critique of it, since I’m told to bring them: “Bring a **pencil** (pens are not allowed), your phone for photos, and your AI essay critique.”

    Then, before going to the archive, I’d search the digital catalog: “Search the New Mexico Digital Archive for your topic. Use exact quotes around multi-word terms.” The same section says to “Note the Collection Number and relevant box numbers from the results,” which I need in order to fill out the request form. I’d also check alternate names (“Names change”) in case my first search comes up empty.

    Then I’d go to Zimmerman Library for “at least an hour,” check in at the reference desk, and ask for help.

    ### What I think I must submit

    An essay published on the UNM Campus History website, which the instructions describe like this: “Your finished essay will be published on the UNM Campus History website.”

    Requirements as listed:

    - “**~800-1000 words**”
    - “**4-5 images** — historical photographs and/or scanned primary sources from CSWR”
    - “**Informative captions** on every image: not just what it shows, but why it’s significant. Cite where you found it (box number, collection name, or URL).”
    - “**Subheadings** to organize your main sections”
    - “**Bibliography** of sources used (CSWR materials + published histories),” with sources specified “exactly” enough “so it can be verified”

    There’s also an **AI-Archive Comparison**, which appears in the grading criteria rather than the requirements list: “An AI-Archive Comparison that’s *specific*: quotes the AI draft and names what was confirmed, contradicted, or simply absent from the archive.”

    The submission mechanism is “submitting a pull request,” per the publishing guide.

    ### How I would judge whether my work is good enough

    The grading section says the project is graded “primarily on **effort and intellectual engagement**, not writing polish or whether you found spectacular archival material.” I’d check myself against the A description: “clear archival evidence throughout; specific sources cited; AI-Archive Comparison quotes the draft directly and names concrete differences; images with substantive captions that explain significance.”

    I’d also run the “weak submission” list as a checklist: could it have been written without visiting the archive? Is the AI comparison generic? Are images missing or uncaptioned? Is it “just a list of facts with no narrative thread”? And for style: “smart magazine, not academic paper.”

    ### Three places I would have to guess

    **1. Where the AI-Archive Comparison goes and how long it is.**

    - *Says:* It’s a grading criterion, and the essay should “fuse” the AI essay and my findings. The “Skills” and “What I’m looking for” sections describe it as a distinct thing (“An AI-Archive Comparison”).
    - *Inferred:* It might be a section inside the 800-1000 word essay, or a separate piece on the page, or something submitted to the instructor only.
    - *Question for the instructor:* Does the comparison count toward the word limit, and is it part of the published page?

    **2. What exactly I turn in to the instructor, versus what gets published.**

    - *Says:* The publishing guide explains “how to publish the page,” while “This **assignment guide** explains what the page needs to argue, document, and reflect on for class.” The word “reflect” hints at something beyond the essay.
    - *Inferred:* Probably the pull request or page link is the submission, but I can’t tell if there’s also a Canvas upload, notes, or a reflection.
    - *Question for the instructor:* Where and how do I submit for the grade, and is there anything besides the page?

    **3. Deadlines and what counts as enough archival evidence.**

    - *Says:* No due date appears in this document. “At least an hour” is the visit length, and the grading mentions “notes that reflect actual digging through boxes.”
    - *Inferred:* My notes might be graded, but nothing says I submit them.
    - *Question for the instructor:* What’s the due date, and are my notes or photos part of what’s evaluated?

    A smaller question I’d also keep in mind: how do I choose my topic, and was it assigned in Part 1? This document refers to “your topic” as if it’s already settled.

- id: assignment-compare-run
  session: editorial-assistant
  strategy: 3
  label: "The comparison"
  run: 'prompt id="assignment-compare"'
  tool: Claude Sonnet 5.5
  date: '2026-10-08'
  note: "A fresh incognito conversation with three files attached: the workshop copy of the assignment and the two recorded readings on this page. The prompt was sent as written."
  text: |
    ### Where student uncertainty meets a design issue

    The student’s three guesses line up with three misalignments the designer found. The designer’s “Part 1 and the linked guide aren’t included” caveat applies to all of them.

    | Student’s practical uncertainty | Design issue behind it |
    | --- | --- |
    | Where the AI-Archive Comparison goes and how long it is | The comparison is graded (“An AI-Archive Comparison that’s *specific*”) but is not in the Requirements list |
    | What gets submitted versus published | The page must “argue, document, and reflect on for class,” but “reflect” has no matching instruction, and submission is handed off to the external guide |
    | Deadline, and whether notes count | “notes that reflect actual digging through boxes” is named as evidence, but notes are never requested, and no due date appears |

    The first is the strongest connection. The student can’t tell how to meet a criterion because the task never names it as a deliverable.

    ### Where the readings differ

    - **Frame:** The student asks “what do I do and how do I know it’s good enough?” The designer audits purpose, task, and criteria for consistency.
    - **Skills:** The designer treats source criticism and reading for absence as a gap (“nothing... asks students to do it in the essay”). The student never mentions them.
    - **Notes:** The student wonders if notes might be graded. The designer says outright that they are never requested.
    - **“Reflect”:** The student reads it as a hint of “something beyond the essay.” The designer reads it as an instruction with no counterpart.
    - **Topic and Part 1:** Only the student raises these (“your topic” as if settled). The designer sets them aside as outside the snapshot.

    ### Claim check

    **Supported by the assignment:**

    - All of the student’s requirement quotes (word count, images, captions, subheadings, bibliography) and the grading quote (“primarily on **effort and intellectual engagement**”).
    - “Bring a **pencil**... and your AI essay critique,” and “Note the Collection Number and relevant box numbers.”
    - The designer’s “about 10 minutes,” the “curious reader... who knows nothing about its history” audience framing, and the weak-submission examples.
    - No due date appears, and no relative weighting is given.
    - The B and C descriptors (“mostly specific,” “thin”) have no examples.
    - The tip “Think about the story you want to tell as you go” is the only task-side mention of narrative.

    **Not fully supported:**

    1. **Student: the “Skills” section describes the comparison as “a distinct thing.”** The Skills section never names an AI-Archive Comparison. Only “What I’m looking for” does. The Skills section only gestures at it (“What would the AI never know because it was never digitized?”).
    2. **Student: the catalog numbers are needed “in order to fill out the request form.”** The assignment says to note them and to “fill out” a request form, but never links the two.
    3. **Student: “reflect” “hints at something beyond the essay.”** The sentence says what “the page needs to argue, document, and reflect on,” so the subject is the page. Both readings treat the word as ambiguous, which is fair, but it may point inside the essay.
    4. **Designer: the comparison is “No” in the task.** This is overstated. The task says “compare it to what the AI told you” and asks the essay to “fuse” the AI essay and findings. What’s missing is the named deliverable and the quote-the-draft requirement, which appear only in the grading section.
    5. **Designer: reading for absence is “not requested in any deliverable.”** This is also overstated. The criteria ask the comparison to name what was “simply absent from the archive,” which is related to absence, though not quite the skill as defined. The grading section also acknowledges “sometimes there isn’t much there.”
    6. **Student: the pull request is the graded submission.** The assignment says the guide covers “submitting a pull request” for the page, not that this is what’s graded.

    ### One clarification to consider

    State, in the Requirements list, where the AI-Archive Comparison appears and whether it counts toward the ~800–1000 words. This clarifies the student’s first uncertainty and the designer’s top priority. It likely also clarifies the second and third items, since the answer shapes what “reflect” means and whether anything beyond the page is submitted.

    ### The decision still open

    The instructor needs to decide whether the comparison is part of the public Campus History page, written for the “curious reader” who “knows nothing about its history,” or a course-only piece read just by the instructor. That choice determines the audience, the word budget, and whether notes or other evidence are submitted. I haven’t resolved it or drafted any wording.

- id: machiavelli-comments
  session: editorial-assistant
  strategy: 6
  label: "Three of Claude's comments, with their passages"
  tool: Claude Fable 5.1
  date: '2026-09-23'
  note: "Copied from the returned Word file, which has 37 comments in all. The study guide was written on September 18, 2026 by Gemma 4 (e4b), a small model run locally through Ollama, and is shared with permission. The prompt for this run wasn't saved; the one above is the workshop's version."
  text: |
    > This is a monumental and complex topic. Machiavelli is not just a political thinker; he was a radical paradigm shift. He moved political theory away from the moral ideals of classical philosophy (Plato, Cicero) and into the messy, pragmatic reality of power.

    Overstated and partly backwards. Machiavelli's break is with the moralizing humanist tradition (the Ciceronian 'mirror for princes'), not with classical antiquity as such. He is saturated in Roman sources — Livy above all, plus Polybius, Sallust, Tacitus, Xenophon, Lucretius — and the preface to Discourses Book I explicitly calls for imitating the ancients. The precise point is that he inverts Cicero's De officiis rather than abandoning it. 'Radical paradigm shift' is filler; the concrete claim is Prince ch. 15's 'verità effettuale della cosa' (the effectual truth of the matter) set against 'imagined republics and principalities.' That phrase is the manifesto of the whole project and appears nowhere in this guide.

    ---

    > To build a comprehensive guide, we must move beyond the common—and often inaccurate—caricature of the "Machiavellian villain." We are analyzing a sophisticated treatise on statecraft and human psychology.

    Good framing — but the guide's own Study Checklist ends by declaring 'The survival of the state justifies the means,' which is exactly the caricature this paragraph promises to move beyond. Internal inconsistency; see comment there.

    ---

    > Before studying his ideas, you must understand the world he lived in. Machiavelli was a product of the tumultuous Renaissance Italian city-states (Florence, Milan, Rome).

    Rome was the seat of the Papal States, not a city-state in the sense Florence and Milan were. The standard five-power system of the Peace of Lodi (1454) is Florence, Milan, Venice, Naples, and the Papacy. Venice and Naples matter here: Venice is the republic Machiavelli measures Rome against throughout the Discourses, and the Neapolitan succession is what brought Charles VIII over the Alps in 1494.

