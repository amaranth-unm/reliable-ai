    I had no way to run a script here, so I did the matching by reading all 1,602 GNIS records in chunks and comparing names by eye. It's worth spot-checking a few rows.

    **Matching rules I used**
    - A record matched if its name equalled the town name or one of its other names, with or without a trailing "(historical)".
    - The record's county also had to equal your county exactly.
    - Coordinates come only from the matched record's decimal latitude and longitude.

    Seven matches were on the "(historical)" form: Blackdom, Bonanza City, Dawson, Hagan, La Belle, Paraje and Santa Rita.

    **Blank rows that had candidates**
    | Row | Reason |
    |---|---|
    | Bramlett (Hidalgo) | The only Bramlett record (899550) is listed under Socorro County, so I rejected it. Its coordinates (31.33, −108.84) look like they're in the Hidalgo bootheel, so GNIS may have the county wrong. You might want to accept it by hand. |
    | Clairmont (Catron) | No exact name. GNIS has **Claremont** (898996) in Catron. It's probably the same place, but the spelling differs, so I didn't accept it. |
    | Gran Quivira (Socorro) | The only record (918196) is in Torrance County, so I rejected it. |
    | San José (Sierra) | There's no Sierra record. There are four "San Jose" records (no accent), all in other counties: 899897 Eddy, 910633 San Miguel, 920836 Bernalillo, 928803 Rio Arriba. |
    | Glenrio (Quay…) | There's no record named Glenrio or Rock Island. Your county cell isn't a plain county name either. |

    **Blank rows with no record of that name at all:** Alamocita, Aleman, Anaconda, Baldy Town, Canta Recio, Carpenter, El Ojo Del Padre, Gobernador, Mowry City, Pittsburg, Road Fork, San Albino, San Ygnacio de la Alamosa, Vinegaroon and Zapata. I checked their other names too.

