  note: "Nothing is cut. Two helper agents wrote the S03 and S04 notes at the same time."
  text: |
    The synthesis is now at version 2 and covers all four sources. The S03 and S04 notes were each written by a separate helper that saw only its own PDF and the reading instructions; both ran at the same time. Version 1 is saved as `history/synthesis-v1.md`, and every change and its reason is in `synthesis-log.md`.

    **Links between the authors:** I checked S03 and S04 for citations of the other sources and found none, so every connection is still mine, marked "Read alongside". S02's mention of the MLA-CCCC task force refers to its working papers in general, not to S03. Its *PMLA* citation is to the Kirschenbaum & Raley essay that S04 responds to, not to S04 itself.

    **New points**
    - **P14, prompting as rhetoric (overlap):** S03 and S04 each call prompt engineering a rhetorical practice, independently. It's the most concrete answer in the set to what the humanities offer AI users. S01 is the dissent: it warns against training students in prompt engineering.
    - **P15, copyright (real disagreement):** S02 says writers' and artists' fair pay "should remain paramount"; S04 calls copyright objections "reactionary". It's narrower than it looks, because S02 also values open access for research.
    - **P16, environmental and labour costs (real disagreement):** S01 and S02 count these costs as serious; S04 says they "bear no special relation" to AI.
    - **P13, poststructuralist theory (possible disagreement):** S02 and S04 draw on the same theory to opposite ends. S02 places meaning with people; S04 questions the idea of a human self that stands apart from language. The two passages may be compatible, so I didn't call it a firm disagreement.
    - **P17 and P18:** what only S03 offers (detailed guidance for teaching in language, literature and writing) and what only S04 offers (literary theory and aesthetics as the humanities' answer to AI).

    **Changed points**
    - **P02 and P03:** S03 and S04 now join in. All four say technical fields alone aren't enough, and all four warn against taking fluent output as knowledge. S04 adds a check on P02: many humanists' first responses have been poor.
