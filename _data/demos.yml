    **Smaller adjustments:** The territorial legislature also moved lines between existing counties in these years, for example around Bernalillo and Santa Fe and in the southeast. I can't list them reliably from memory. The AHCB chronology is the place to get the full list.

    **Second source for each change:** The 1910 census report (*Thirteenth Census, Vol. III, Population*, New Mexico county table) prints 1900 figures next to 1910 ones. Its footnotes say when a county lost territory to form another (for example "part taken to form Luna in 1901"). That gives you an independent check on the AHCB from the Census Bureau's own records.

