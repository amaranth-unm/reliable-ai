  text: |
    I can point to one of the three:

    > "The goal of this policy is to support learning rather than to prohibit
    > technology"

    That is the sentence I meant by "gestures at this."

    For the other two I can't. "Students respond better to guidelines when
    they understand the reasoning" is a general belief about teaching, not
