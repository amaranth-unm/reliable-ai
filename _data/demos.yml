    > then that action is justified by the outcome

    This is the 'ends justify the means' paraphrase. That phrase never appears in Machiavelli. Prince ch. 18 says that in the actions of princes 'si guarda al fine': people look to the outcome. That describes how rulers are judged, and translators and scholars disagree on how far it is a moral justification. Prince ch. 8 (Agathocles) also says crimes may win power but not glory, and that killing fellow citizens cannot be called virtù. Check: Prince ch. 8 and 18 in Italian and in two translations.

    > He often compares a ruler to a river

    Inaccurate. The river image appears mainly in Prince ch. 25, and there Fortuna is the river, not the ruler. Virtù is the dikes and embankments built 'in quiet times', not a dam across the river. 'Often' is unsupported. The same chapter's second image, Fortuna as a woman, is left out. The 'wheel of fortune' in the previous bullet comes from his poem 'Di Fortuna', not from The Prince. Check: Prince ch. 25 and the capitolo 'Di Fortuna'.

    > If the state falls, all other goods—justice, law, family, religion—fall with it.

    This is presented as Machiavelli's argument but is not cited, and I don't know of a passage that says it. Inference: it may be a loose reconstruction of Discourses III.41 (when the safety of the patria is at stake, no consideration of just or unjust applies). If so, cite that passage and present the rest as the author's gloss.

