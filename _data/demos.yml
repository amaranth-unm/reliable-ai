    The file is […]

    ## Matching your table to the boundaries
    The page gets New Mexico's counties (state code 35) from the Census Bureau's TIGERweb service. It joins them to your table on a five-digit code made from your `STATE` and `COUNTY` columns. Those are kept as text, so leading zeros aren't lost (35 + 001 → `35001`). It prints both lists of unmatched records above the map before it draws the map.

    - **Your table:** 33 county rows. I left out the statewide row (`SUMLEV 040`, code 35000) because it isn't a county.
    - **What I expect:** no mismatches either way. Your 33 codes are the same as the 33 current New Mexico county codes, including Cibola (35006) and Los Alamos (35028), which were created later than the others. The lists on the page come from the live data, so if anything doesn't match, that's what they will show.
    - **One risk:** I took the two TIGERweb web addresses from memory and haven't tested them. If both fail, the page shows an error instead of a map. Let me know and I'll change it to load a boundary file saved on your computer.

    ## Values used
    Percent change = (`POPESTIMATE2024` − `POPESTIMATE2020`) / `POPESTIMATE2020`. Both columns are July 1 estimates, so it compares the same point in each year. I didn't use `ESTIMATESBASE2020`, which is the April 1 starting figure. County values run from −5.02% (McKinley) to +6.17% (Torrance). The state overall grew 0.55%.

    ## Color classes
    There are six classes, each 2 percentage points wide, with 0% as a boundary between classes:

    | Class | Counties |
    |---|---|
    | Loss of 4% or more | 2 (Hidalgo, McKinley) |
    | Loss of 2% to under 4% | 10 |
    | Loss of under 2% | 10 |
    | Gain of 0% to under 2% | 5 |
    | Gain of 2% to under 4% | 1 (Otero) |
    | Gain of 4% or more | 5 (Catron, Doña Ana, Sandoval, Torrance, Valencia) |

    **Why this grouping:** what matters most here is whether a county grew or shrank, so zero has to be a dividing line. Even 2-point steps on both sides are easy to read and compare, unlike quantile or natural-breaks boundaries such as "−1.37 to −0.47". The classes don't hold equal numbers of counties, which is accurate: most counties lost population. The legend shows how many counties fall in each class.

    ## Colors
    I used ColorBrewer's 6-class red–blue diverging scheme, from `#b2182b` to `#2166ac`. Red means loss and blue means gain, and the colors get lighter toward zero. I chose it because the data runs in two directions from a meaningful midpoint, and this scheme stays readable for people with color blindness and in grayscale. Gray is kept for any county without data.

    ## Projection
    I used an Albers equal-area conic with standard parallels at 32.5°N and 36.5°N, centered on 106°W, which fits New Mexico closely. On a choropleth, the area of each county shapes how much attention it gets. An equal-area projection keeps those areas true, which Web Mercator (the usual web-map projection) doesn't.

    […]

