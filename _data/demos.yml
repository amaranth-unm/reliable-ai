- id: mapping-figure
  session: mapping-with-ai
  label: "The figure"
  run: "mapping-figure with a checked CSV and boundary file. Replace this include with the PNG it produced."
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "Like step 3, this run could run commands, limited to its own folder, so it ran the script and checked the output itself. We checked its figures against the CSV: the statewide change, the range of the classes and the Catron example are all right."
  text: |
    I wrote the script as `nm_pop_change_map.py`, ran it, and checked the output. The PNG is 1950 × 1770 px at 300 dpi and the PDF page is 468 × 424.8 pt. Both are exactly 6.5 × 5.9 in.

    **What's on the map**
    - **Shading:** six classes, with 0% as a class break, so each class is either all loss or all gain. Losses are oranges and gains are blues. The colours also get steadily darker from the biggest loss to the biggest gain, so they still read in order in grayscale. I converted the PNG to gray and the six shades are clearly different. The script checks this every time it runs and stops if two neighbouring colours would print too close to the same gray.
    - **Legend:** each class shows its range and how many counties fall in it. The lowest and highest limits (−5.0 and +6.2) come from the data. A note under the legend gives the statewide change (+0.5%), taken from the state row in the CSV.
    - **Scale bar:** in km and miles, in the empty space below the southern border.
    - **County names:** each name is placed only if it fits inside the county, trying a smaller size or two lines before giving up. 32 of 33 fit. Los Alamos is too small, so it's left off the map and listed in the note.
    - **Source line:** exactly the text you specified.
    - **Projection:** Albers Equal-Area Conic on NAD83, fitted to New Mexico. The comment at the top of the script states this. I used an equal-area projection so each county's shaded area matches its real size.
    - **No typed data:** every number comes from the CSV. The CSV and the boundary file are matched by county FIPS code, and the script stops with an error if any county doesn't match.

    **Decision for you:** the change is measured from the July 1, 2020 estimate to the July 1, 2024 estimate, so both ends use the same date. If you'd rather start from the April 1, 2020 estimates base, run with `--base april2020`. Most counties shift by a few tenths of a point. Some, like Catron, move more (+5.2% becomes +6.0%), but no county changes class.

    **Install**
    ```bash
    python3 -m venv .venv
    source .venv/bin/activate
    pip install geopandas matplotlib
    ```
    `geopandas` installs pandas, shapely, pyproj and pyogrio with it, and pip provides prebuilt versions for macOS, Windows and Linux. If you use conda: `conda install -c conda-forge geopandas matplotlib`.

    **Run**

    Put the script, the CSV and the zip in the same folder. Leave the zip as it is; the script reads it directly. Then:
    ```bash
    python nm_pop_change_map.py
    ```
    This writes `nm_population_change_2020_2024.png` and `nm_population_change_2020_2024.pdf` to that folder. To use other paths or file names:
    ```bash
    python nm_pop_change_map.py --csv data/nm.csv --boundaries data/cb_2023_us_county_500k.zip --out figures/fig1
    ```

    To change the class breaks or colours, edit `BREAKS` and `COLORS` near the top of the script. The text in the PDF is kept editable. If the figure will have a separate caption, you can delete the two `fig.text` lines that draw the title and subtitle.

