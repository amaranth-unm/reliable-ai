- id: rule-harvest-run
  session: editorial-assistant
  label: "The rules behind the corrections"
  run: "baseline: rule-harvest, same chat, after the three corrections"
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "Sent in the same chat, after the three corrections. Nothing is cut. The offer at the end to “save these rules to memory” comes from the tool used for these runs; a browser chat may offer something similar or nothing."
  text: |
    Here are the three corrections and the rule behind each.

    **1. Keep the author's modal verbs ("should," "may," "must," "will") exactly as written. They set how binding a requirement is, so changing them is a substantive edit, not a trim.**

    > Me: "'Any use of AI should be disclosed' became 'Disclose any use of AI'" (listed under "Small trims")
    >
    > You: "Put 'should' back in both places. 'Disclose any use of AI' turns a recommendation into a command, and I haven't decided yet whether disclosure is required."

    **2. Keep sentences in the author's order. If I think reordering would help, propose it and ask before making the change.**

    > Me: "Moved the goal statement to the front. It frames the rules that follow…"
    >
    > You: "Move the goal statement back to the end. I want students to meet the rules first and the reason last. Please don't move sentences without asking."

    **3. Keep the author's grammatical person. Don't switch between third and second person unless asked, even if I flag the change as optional.**

    > Me: "Switched from 'students' to 'you.' … If your other syllabus policies use third person, keep 'students' here for consistency."
    >
    > You: "Change 'you' back to 'students'. The rest of my syllabus is in the third person."

    There's a pattern behind all three: anything beyond trimming words is a change I should propose, not make.

    I left out dropping "in this course" and "If you are." I noticed those myself; you didn't correct them, so they don't meet your criterion.

    Would you like me to save these three rules to memory so they apply in future editing sessions?

- id: rule-sharpen-run
  session: editorial-assistant
  label: "Making a rule checkable"
  run: "rule-sharpen: the rule filled in as shown, new chat"
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "A new chat. The rule pasted in was “Don't make my policy sound stricter than it is.” Nothing is cut."
  text: |
    **Not as written.** A reader can't tell whether something sounds "stricter than it is" without knowing what the policy actually is, and "sounds stricter" is a judgment about tone. Two careful readers could disagree.

    It becomes checkable if the comparison is against **the written policy text**, and the rule names the specific ways strictness creeps in:

    > **When describing one of my policies, match the policy's own wording on obligation and scope:**
    > - Keep its modal verbs. Don't turn *may*, *should*, *encouraged*, or *recommended* into *must*, *required*, or *not allowed*.
    > - Don't add *always*, *never*, *all*, *any*, or *only* unless the policy uses them.
    > - Keep every exception, condition, and "unless…" the policy states.
    > - Don't describe a consequence (penalty, grade deduction, removal) that the policy doesn't state.

    With the policy and the new text side by side, someone who doesn't know you can check each point.

    **What you'd have to decide first:**

    1. **Where the policy lives.** The rule only works if there's an authoritative written version to compare against, such as a syllabus section or a policy page. If the policy exists only in your head, nobody else can check this, and the fix is to write the policy down first.
    2. **Whether paraphrase is allowed at all.** If even a faithful paraphrase worries you, the stricter and simpler rule is "Quote the policy verbatim, or link to it; don't restate it." That rule is trivially checkable.
    3. **Whether "sounding stricter" includes emphasis.** Bold, all-caps, or warnings like "Important:" can make a policy read as harsher without changing a word of it. If you care about that, add a line such as "Don't add emphasis or warning labels the policy doesn't have."

- id: rule-test-run
  session: editorial-assistant
  label: "Where the rule misfires"
  run: "rule-test: the first harvested rule and three practice-text sentences filled in, new chat"
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "A new chat. The rule was the first one harvested above. The three passages were the policy's first sentence, a sentence from paragraph 3 of the archive report and the last sentence of the seminar paragraph. Nothing is cut."
  text: |
    # Rule check: modal verbs

    **1. Applies.**
    Triggers: "**may** use" and "**should** not use"

    This is the case the rule was written for. "May" grants permission and "should not" sets a prohibition. Changing either one, for example "should not" to "must not," would change how binding the policy is.

    **2. Fires, but for the wrong reason. This is your misfire.**
    Trigger: "The limited response **may** reflect"

    This "may" is epistemic. It hedges a guess about why something happened, and nothing in the sentence is a requirement. The rule's stated reason ("they set how binding a requirement is") doesn't fit here. The rule fires because the word appears, not because its purpose is in play.

    The outcome is still right: changing "may reflect" to "reflects" would overstate the author's certainty, so the word should stay. But a rule that reaches the right answer for the wrong reason is fragile. An editor who looks at the rationale could reasonably conclude it doesn't cover this sentence.

    The sentence also has "**could** be changed." "Could" isn't on your list, so the rule doesn't catch it. That isn't a misfire, but it shows the list is narrower than "modal verbs" in general.

    **3. Doesn't apply.**
    There are no modal verbs here. "Suggests" does similar hedging work to the "may" in passage 2, but it's a reporting verb, so the rule is silent. That's a gap in coverage rather than a misfire.

    ## Suggested fix

    Separate the two jobs. Keep this rule for obligation and permission ("must," "should," "may" as permission, "will" as commitment). Add a second rule for hedges ("may," "might," "could," "suggests," "appears") that preserves the author's level of certainty. With that split, passage 2 is covered for the right reason and passage 3's "suggests" gets protection too.

- id: archive-general-run
  session: editorial-assistant
  label: "A general edit of the report"
  run: "archive-general: archive-report.txt pasted above the prompt, new chat"
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "The report was pasted above the prompt. The second half of the change list is cut."
  text: |
    ## Edited version

    Over the past year, the Arroyo Memory Project has recorded 32 interviews and digitized photographs contributed by local families. Our aim was practical: to make materials held in separate homes easier to find and use. The collection now includes accounts of work, migration, and neighborhood change that rarely appear in the town's official records. Bringing these materials together also raises a less practical question: who gets to describe them, and whose account does a visitor encounter first?

    By "shared stewardship," we mean that contributors have a continuing role in decisions about description and access. They can suggest corrections, add context, or ask that an interview stay offline. The project team makes final decisions about descriptions after consulting contributors, and a common description template makes records from different contributors easier to compare. This arrangement keeps descriptions consistent while giving community members a real say in how their histories are presented.

    Eight of the 32 interviewees reviewed their descriptions during the pilot. Their comments led us to revise several place names and to distinguish a remembered event from a date established in another source. The limited response may reflect the time needed to review a transcript, uncertainty about what could be changed, or a preference for discussing revisions in person. We cannot yet tell which explanation matters most. What is already clear is that making the collection searchable is only one part of making it usable.

    In the next phase, we plan to hold two review sessions at the public library where contributors can compare descriptions together. We will add context where appropriate and document any disagreements we cannot resolve. We also hope to learn whether visitors can tell when an account is a recollection rather than an agreed chronology. The pilot suggests that digital access can strengthen community ownership of local history, but the decisions about whose words appear on the screen remain unfinished.

    ## What changed and why

    **Two changes that affect meaning. Please check these.**

    1. **"retain control" → "a real say."** The original says the team makes final decisions and also that community members "retain control." Both can't be true. "A real say" matches the process you describe: consultation, then a team decision. If contributors do have binding control in some areas, such as keeping an interview offline, say so directly. For example: "...giving contributors the final word on online access and a strong voice in description."
    2. **"The pilot shows that digital access strengthens" → "suggests... can strengthen."** Only eight of 32 people responded, and the previous paragraph says you can't yet explain why. A firm claim of proof undercuts that honesty. The hedged version matches your evidence and your cautious voice elsewhere.

    […]

- id: archive-guide-run
  session: editorial-assistant
  label: "A reading against the guide"
  run: "archive-guide: archive-style-review with the guide and report pasted into its brackets, new chat"
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "A new chat. The guide and the report were pasted where the prompt's brackets are. Findings 3 and 4 are cut."
  text: |
    # Review against the proposed style guide

    The guide fits this report's purpose and audience, so I haven't changed any rules. The most important problems involve Rules 1–3, which the guide ranks first, so I've listed them first.

    ## Decisions about meaning (author input needed)

    **1. The conclusion claims more than the evidence supports, and it uses the wrong term**

    > "The pilot shows that digital access strengthens community ownership of local history, although the decisions about whose words appear on the screen remain unfinished."

    - **Rule 1 (evidence and limits):** The pilot evidence is that 8 of 32 contributors reviewed their descriptions, and the team cannot yet explain why so few did. That doesn't show that access *strengthens* anything. "Shows" is stronger than the earlier "may" and "we cannot yet tell."
    - **Rule 2 (distinctions):** The report never claims ownership. It defines shared stewardship as a *role* in decisions. This sentence treats access as if it produces ownership.
    - **Decision for the author:** What does the pilot actually suggest? Is "ownership" the intended word, or would "shared stewardship" or "participation" be more accurate? I wouldn't change this sentence until the author decides.

    **2. "Control" contradicts the arrangement just described**

    > "Final decisions about descriptions are made by the project team after consultation. This arrangement allows us to maintain consistency while ensuring that community members retain control over how their histories are presented."

    - **Rule 2:** If the team makes final decisions, contributors are consulted and participate, but they don't control the outcome. One exception may be the right to request that an interview stay offline. That sounds like real control over *access*, though not over *description*.
    - **Rule 3 (decision-making):** The passive voice is acceptable here because the actor is named. What remains unclear is who decides when a contributor and the team disagree.
    - **Decision for the author:** Which kind of authority do contributors have, and over what? The author could say that contributors control online availability while the team decides descriptions after consultation. That would match the definition of shared stewardship. I'd need the author to confirm it's accurate first.

    […]

    ## Wording change

    **5. Wordy noun phrase with an unclear meaning**

    > "The implementation of a common description template has facilitated the comparison of records by contributors."

    - **Rule 4:** "The implementation of… has facilitated the comparison of…" stacks nominalizations. A possible direction is "We introduced a common description template, which makes it easier for contributors to compare records." This uses the report's "we," per Rule 5.
    - One small check is needed before the edit: "comparison of records by contributors" could mean that contributors compare records or that someone compares records *made by* contributors. The next sentence ("They can suggest corrections…") suggests the first reading, but the author should confirm.

    ## Leave alone

    > "The limited response may reflect the time required to review a transcript, uncertainty about what could be changed, or a preference for discussing revisions in person. We cannot yet tell which explanation matters most."

    Rule 1 explicitly protects qualifications like "may" and "we cannot yet tell." The passage gives concrete possible explanations, stays measured (Rule 5), and doesn't overclaim. Tightening or firming it up would weaken the report's most careful handling of evidence. It is also the standard the final sentence (item 1) should be brought back in line with.

