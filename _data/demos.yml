    - **Source:** S01 p. 1 (last paragraph) to p. 2 (first paragraph): "'AI' is everywhere and nowhere, and so is its history. On one hand… On the other hand, centering on AI as a specific set of technical systems… risks obscuring the fact that artificial intelligence participates in… many broader logics and histories…" Compare S03 p. 2 [96], "AI was not invented before the 1950s", and p. 14 [108], "specific forms of AI before AI".
    - **What needs correcting:** In S01 the phrase is an argument *for* widening AI's history. It is not an admission that the history lacks boundaries. S03 does mark a limit, both by keeping the 1950s invention and through the phrase "AI *before* AI", which keeps media and AI distinct even in the conclusion. The boundary problem is your question, and the synthesis says so, but the claim that S01 "acknowledges" or "states" it is not supported.
    - **Proposed action:** Remove "S01 acknowledges the issue" and "S01 states the problem itself". Keep the open question, labelled as yours. Note that S03 marks a limit that S01's introduction does not state.

