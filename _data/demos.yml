  text: |
    The tone is generally supportive, but the policy could do more to convey
    the pedagogical rationale behind these restrictions. Students respond
    better to guidelines when they understand the reasoning, and there's an
    opportunity here to frame AI use as a skill to be developed rather than a
    risk to be managed. The final sentence gestures at this but could be
    developed further.

