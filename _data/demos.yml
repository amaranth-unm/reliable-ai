  text: |
    ## Proposed style guide for the Ruiz CV

    Nothing has been edited. The rules below come from patterns in the extracted text, so rules 5 and 6 depend on structure I couldn’t see and need a check in Word first.

    One correction to my first audit: I said the last Service entry lacked bold “unlike its neighbors.” Only two Service entries use bold, so the inconsistency is within the whole section (rule 7).

    ### Part A: Formatting decisions

    **1. Date and page ranges use an en dash with no spaces. Open-ended ranges use lowercase “present.”**

    - Professional Experience, “2024–Present” → “2024–present” (every other open range uses lowercase).
    - Professional Experience, “2019-2020” (Public history intern) → “2019–2020”.
    - Articles and Chapters, 2022 *Journal of Public History and Technology* article, “45-62” → “45–62”.
    - Only the punctuation or capitalization changes, never the numbers.

    **2. Entries run in reverse chronological order by start date.** This is the pattern in Education, Experience, Publications, Digital Projects, Workshops, Teaching, and Awards.

    - Conferences: the 2024 “Teaching Students to Read a Digital Exhibit” and the 2023 “The Work after Launch” entries sit after the 2023 entry. Each would move up into its year group. Order within a year is your call.
