    - **Elephant Butte:** The record (898770) is probably the modern city rather than the historic site.
    - **Pinos Altos (High Pines):** I matched on "Pinos Altos" and ignored the "(High Pines)" in your name cell. I rejected a second Pinos Altos in San Miguel County.

    **Matched, with a same-named record rejected for county:** Lake Valley (another in San Juan), Paraje (another in Cibola), Tejon (a "Tejon (historical)" in Sandoval) and Shakespeare (its other name Mexican Springs matches a record in McKinley). Each one's `match_note` gives the details.

