- id: agentic-baseline-run
  session: understanding-agentic-ai
  label: "The review that came back"
  run: "agentic-baseline: a new chat"
  tool: "Claude Opus 5.5 in Claude Code, fresh session with web search and web fetch only"
  date: "2026-11-11"
  note: "Nothing is cut."
  text: |
    Here are five sources that work as a starting map. I checked the bibliographic details against publisher and catalog pages, but I haven't read the full text of each source this session. The summaries draw on the works themselves and on reviews, so check page-level claims before you quote them.

    ## Five sources

    **1. Emily M. Bender, Timnit Gebru, Angelina McMillan-Major, and Shmargaret Shmitchell, "On the Dangers of Stochastic Parrots: Can Language Models Be Too Big?" *Proceedings of the 2021 ACM Conference on Fairness, Accountability, and Transparency (FAccT '21)*, 610–623. https://doi.org/10.1145/3442188.3445922**

    The authors argue that large language models stitch together linguistic form without access to meaning or communicative intent. They call them "stochastic parrots." The models' fluency invites people to read meaning into them that isn't there. The authors also tie scale to concrete harms: environmental cost, training data that encodes dominant and often hateful viewpoints, and the difficulty of documenting what the data contains. It isn't strictly a humanities paper; it comes from linguistics and AI ethics. But nearly all the later humanities debate responds to it, so it's the natural place to start.

    **2. Ted Underwood, "Mapping the Latent Spaces of Culture," blog essay, October 21, 2021 ([tedunderwood.com](https://tedunderwood.com/2021/10/21/latent-spaces-of-culture/)); reprinted in *Startwords* 3 ([Princeton CDH](https://startwords.cdh.princeton.edu/issues/3/mapping-latent-spaces/))**

    Underwood, a literary historian, wrote this as a direct reply to Bender et al. for a Princeton roundtable. He agrees that the models are risky but rejects the premise that they have no access to meaning. Historians already find meaning in genres, motifs and trends that no single author intended. He argues we should treat LLMs as *models of culture*: tools for representing and comparing styles, genres and perspectives, for example by training models on different periods or venues.

    **3. Leif Weatherby, *Language Machines: Cultural AI and the End of Remainder Humanism* (University of Minnesota Press, 2025; Posthumanities 74)**

    Weatherby, a Germanist at NYU, pushes Underwood's position into a full theory. He argues that LLMs don't simulate cognition. They produce culture, and structuralist semiotics (Saussure, Jakobson) combined with Shannon's information theory explains them better than cognitive science does. His target is "remainder humanism," the defensive habit of defining the human as whatever machines can't yet do. His conclusion is that literary theory should be the backbone of a new rhetorical training for a linguistic-computational culture. ([Henry Farrell's review at Crooked Timber](https://crookedtimber.org/2025/07/11/cultural-theory-was-right-about-the-death-of-the-author-it-was-just-a-few-decades-early/) is a useful way in.)

    **4. Shannon Vallor, *The AI Mirror: How to Reclaim Our Humanity in an Age of Machine Thinking* (Oxford University Press, 2024)**

    Vallor, a philosopher of technology and virtue ethicist, argues that AI is less an alien mind than a mirror. It reflects and distorts our past moral and epistemic habits, showing us "as we already are and have long been," not as we could be. Because the models are trained on that past, leaning on them risks locking in old biases just when we need new moral imagination. She concludes that AI should augment human judgment rather than automate it. (Reviews: [Critical Inquiry](https://criticalinquiry.uchicago.edu/jaehoon_lee_reviews_the_ai_mirror/), [Physics World](https://physicsworld.com/a/lost-in-the-mirror-as-ai-development-gathers-momentum-will-it-reflect-humanitys-best-or-worst-attributes/).)

    **5. MLA-CCCC Joint Task Force on Writing and AI, "Overview of the Issues, Statement of Principles, and Recommendations," Working Paper 1, July 2023 ([mlaai.hcommons.org](https://mlaai.hcommons.org/working-papers/))**

    This is the main teaching document from the two big US writing and literature organizations. It's about 15 pages. It affirms that writing is a process as well as a product, and that writers' labor deserves credit. It warns that AI summaries could undercut critical writing instruction and that AI-detection tools could alienate students through surveillance. It also names possible benefits, such as multimodal projects. Its recommendations are principle-based and aimed at teachers, administrators and policymakers.

    ## How they relate

    - **The meaning debate (1 → 2 → 3).** Bender et al. say there's no meaning in the machine. Underwood says there is meaning, but it's cultural and collective rather than intended. Weatherby makes that into a theory and argues that it puts literary and semiotic theory at the center of understanding AI. This is the main intellectual disagreement in the field. It matters for teaching because it decides whether you present AI output as empty mimicry or as a cultural artifact you can analyze.
    - **Reflection of the past (1, 2, 4).** All three agree that models encode their training corpus. Bender et al. treat that as a source of harm, Underwood treats it as something to research, and Vallor treats it as a moral limit. Vallor sits between the camps: she grants that the models reflect something real, which is our own history, but she shares Bender's worry about mistaking that reflection for a mind.
    - **From theory to classroom (5).** The MLA-CCCC paper doesn't take a side in the meaning debate. Its defense of writing as process and as a way of thinking echoes Vallor's "augment, don't automate." It also stands in some tension with Weatherby, whose critique of "remainder humanism" questions any pedagogy built on protecting what's uniquely human.

    **Good next reads:** the journal *Critical AI* (Duke University Press), edited by Lauren Goodlad and Matthew Stone, and Bender and Alex Hanna's *The AI Con* (2025). I didn't include either here because I couldn't confirm their citation details this session.

