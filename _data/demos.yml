    > **Use of AI Tools.** Students may use generative AI tools in this course where appropriate, but should not use them to complete assignments for them. Any use of AI should be disclosed. Work substantially produced by AI will not receive credit and may be referred as an academic integrity violation. Students are responsible for the accuracy of everything they submit. If you are unsure whether a particular use is permitted, ask before submitting. The goal of this policy is to support learning rather than to prohibit technology, and I expect students to use their judgment.

