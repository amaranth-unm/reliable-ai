    **No change proposed:** the “Venue, City, ST” pattern, the two-letter state abbreviations, the periods in degree abbreviations, and the 2018–2019 teaching entry that repeats the Experience entry.

    ### Part B: Factual questions only you can answer

    These stay untouched until you answer.

