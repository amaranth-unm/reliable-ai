- id: mapping-county-nm
  session: mapping-with-ai
  label: "The New Mexico county map"
  run: "mapping-county-nm with a county table. Paste the unmatched list and the classification explanation, and add a screenshot."
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "Sent with New Mexico's 34 rows from the Census Bureau's 2024 county estimates file, choosing percent change from 2020 to 2024. The popup section is cut."
  text: |
    I've made the map, but I haven't opened it in a browser, and I couldn't download the Census boundaries from here because I can only read and write files. So the page fetches them itself each time it opens. That means it needs an internet connection, and the matching below hasn't been run against the live boundary data yet.

    The file is […]

    ## Matching your table to the boundaries
    The page gets New Mexico's counties (state code 35) from the Census Bureau's TIGERweb service. It joins them to your table on a five-digit code made from your `STATE` and `COUNTY` columns. Those are kept as text, so leading zeros aren't lost (35 + 001 → `35001`). It prints both lists of unmatched records above the map before it draws the map.

    - **Your table:** 33 county rows. I left out the statewide row (`SUMLEV 040`, code 35000) because it isn't a county.
    - **What I expect:** no mismatches either way. Your 33 codes are the same as the 33 current New Mexico county codes, including Cibola (35006) and Los Alamos (35028), which were created later than the others. The lists on the page come from the live data, so if anything doesn't match, that's what they will show.
    - **One risk:** I took the two TIGERweb web addresses from memory and haven't tested them. If both fail, the page shows an error instead of a map. Let me know and I'll change it to load a boundary file saved on your computer.

    ## Values used
    Percent change = (`POPESTIMATE2024` − `POPESTIMATE2020`) / `POPESTIMATE2020`. Both columns are July 1 estimates, so it compares the same point in each year. I didn't use `ESTIMATESBASE2020`, which is the April 1 starting figure. County values run from −5.02% (McKinley) to +6.17% (Torrance). The state overall grew 0.55%.

    ## Color classes
    There are six classes, each 2 percentage points wide, with 0% as a boundary between classes:

    | Class | Counties |
    |---|---|
    | Loss of 4% or more | 2 (Hidalgo, McKinley) |
    | Loss of 2% to under 4% | 10 |
    | Loss of under 2% | 10 |
    | Gain of 0% to under 2% | 5 |
    | Gain of 2% to under 4% | 1 (Otero) |
    | Gain of 4% or more | 5 (Catron, Doña Ana, Sandoval, Torrance, Valencia) |

    **Why this grouping:** what matters most here is whether a county grew or shrank, so zero has to be a dividing line. Even 2-point steps on both sides are easy to read and compare, unlike quantile or natural-breaks boundaries such as "−1.37 to −0.47". The classes don't hold equal numbers of counties, which is accurate: most counties lost population. The legend shows how many counties fall in each class.

    ## Colors
    I used ColorBrewer's 6-class red–blue diverging scheme, from `#b2182b` to `#2166ac`. Red means loss and blue means gain, and the colors get lighter toward zero. I chose it because the data runs in two directions from a meaningful midpoint, and this scheme stays readable for people with color blindness and in grayscale. Gray is kept for any county without data.

    ## Projection
    I used an Albers equal-area conic with standard parallels at 32.5°N and 36.5°N, centered on 106°W, which fits New Mexico closely. On a choropleth, the area of each county shapes how much attention it gets. An equal-area projection keeps those areas true, which Web Mercator (the usual web-map projection) doesn't.

    […]

- id: mapping-county-us
  session: mapping-with-ai
  label: "The national county map"
  run: "mapping-county-us in the same chat. Paste the unmatched list, and add a screenshot."
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "Same session, sent with all 3,195 rows of the estimates file, trimmed to the columns used. The colors and popup sections are cut."
  text: |
    I've built the national map, but I couldn't run it or reach the Census Bureau from here, so neither the map nor the matching has been tested yet. The page fetches the county boundaries itself, checks the match, and shows the lists of failures grouped by state before it draws the map.

    **One change from the New Mexico version:** the page doesn't contain your data. When it opens, it asks you to pick or drag in `us-county-population-2020-2024.csv`. Copying all 3,144 rows into the page by hand could have introduced typos you'd never notice, and browsers won't let a page open a file next to it on its own. If you'd rather have everything in one file, I can do that, but I'd need a way to copy the data automatically.

    The file is […]

    ## Matching failures I expect
    I read the whole table. It has 3,144 county rows for the 50 states and DC, plus 51 state-total rows, which I left out. The codes are all current:
    - Connecticut uses its nine planning regions (09110–09190).
    - Alaska has Chugach (02063) and Copper River (02066).
    - The renamed counties are there: Kusilvak (02158) and Oglala Lakota (46102).
    - Bedford city, Virginia (absorbed into Bedford County in 2013) is gone, as it should be.

    So I expect:
    - **Table rows with no boundary match:** none.
    - **Boundaries with no table match:** probably all in Puerto Rico (78 municipios) and possibly the island areas: American Samoa 5, Guam 1, Northern Mariana Islands 4, U.S. Virgin Islands 3. That depends on what the Census service includes, which I couldn't check. These aren't errors: the Census Bureau's national county file covers only the 50 states and DC. They also fall outside this kind of U.S. map, so they wouldn't be drawn anyway.

    The page explains the common causes itself when it sees them. The most likely one is Connecticut, if old boundaries meet new codes or the reverse. Others it recognises are past Alaska, South Dakota, Virginia and Florida code changes, and missing territories. Anything else gets flagged as unexplained, to check for typos or lost leading zeros.

    ## Measure
    Same as before: percent change from `POPESTIMATE2020` to `POPESTIMATE2024`, both July 1 estimates.

    ## Color classes
    There are eight classes split evenly around zero, with breaks at −10, −5, −2, 0, 2, 5 and 10%. The values run much wider than in New Mexico, from about −20% (Garza County, TX) to over +30% (Kaufman County, TX). Most counties sit within a few points of zero, so the classes are narrow near zero and wider at the ends. That shows detail where most counties are without hiding the extremes. Zero is still a dividing line, so gain versus loss reads at a glance. I avoided equal-count (quantile) classes for the same reason as before: their breaks would be odd numbers that are hard to read. The legend shows how many counties fall in each class, and the range and median.

    […]

    ## Projection
    I used the standard U.S. Albers equal-area projection, with Alaska and Hawaii in their own boxes. An equal-area projection keeps county sizes true within each part of the map. One trade-off: **Alaska is shown at about 35% of the main map's scale**, so its boroughs look smaller than they really are. The note on the page says so.

    […]

    ## Risks
    - I took the Census service addresses from memory and haven't tested them. If both fail, the page lets you load a county boundary file from your computer instead.
    - The boundaries are simplified to about 500 m. Very small areas, such as some of Virginia's independent cities, may show up as tiny slivers, and an extremely small one could disappear.

