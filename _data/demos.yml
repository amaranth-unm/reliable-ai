  note: "The policy was pasted above the prompt. Nothing is cut."
  text: |
    **Revised:**

    > **Use of AI Tools.** The goal of this policy is to support learning, not to prohibit technology. You may use generative AI tools where appropriate, but not to complete assignments for you. Disclose any use of AI. Work substantially produced by AI will not receive credit and may be referred as an academic integrity violation. You are responsible for the accuracy of everything you submit. I expect you to use your judgment; if you're unsure whether a particular use is permitted, ask before submitting.

    **Changes:**

    - **Moved the goal statement to the front.** It frames the rules that follow, so readers see the rules as supporting learning rather than as a list of restrictions. Your wording is unchanged apart from "rather than" becoming "not."
    - **Switched from "students" to "you."** This is more direct and matches the "I" you already use. If your other syllabus policies use third person, keep "students" here for consistency.
    - **Combined the two closing sentences about judgment.** "Use your judgment" and "ask if unsure" express the same idea, so they now sit together at the end.
    - **Small trims:** "Any use of AI should be disclosed" became "Disclose any use of AI," and "Work that is substantially produced" became "Work substantially produced."

    **One point you may want to clarify (I didn't change it):** "not to complete assignments for you" and "substantially produced by AI" describe roughly the same line in two different ways, but neither tells students what *is* acceptable. One or two examples would help, such as "brainstorming or checking grammar is fine; generating drafts is not." That would also cut down on the "ask before submitting" questions you get.

- id: policy-reader-brief-run
  session: editorial-assistant
  label: "Six disclosure questions"
  run: "reader-brief: syllabus-policy.txt pasted above the prompt, new chat"
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "The policy was pasted above the prompt. Items 5 and 6 are cut."
  text: |
    # Disclosure issues in the AI policy

    The policy's only disclosure instruction is one sentence: **"Any use of AI should be disclosed."** A first-year student can't act on it without answers to the questions below. Each item lists what the student can't do and the decision you need to make.

    ### 1. What counts as "use"

    > "Any use of AI should be disclosed."

    **What the student can't do:** Tell whether ordinary tools count. Grammarly suggestions, autocomplete in Google Docs or Word, AI summaries at the top of search results, translation tools, and asking a chatbot to explain a reading are all AI, and most first-years won't recognize some of them as AI at all. "Any" could mean every one of these, or only tools the student deliberately opened. The student can't tell whether they're under-disclosing or over-disclosing.

    **Your decision:** Does "any" mean literally any AI-assisted tool, or only generative tools used for the work itself? If there's a line, where is it?

    ### 2. "Should" versus "must"

    > "Any use of AI **should** be disclosed."

    **What the student can't do:** Tell whether disclosure is required or recommended. The next sentence names consequences for substantial AI work, but no sentence names a consequence for failing to disclose. A student could reasonably read "should" as advice.

    **Your decision:** Is failing to disclose a violation in its own right? If so, what follows from it: lost credit, a referral, or something else?

    ### 3. How and where to disclose

    > "Any use of AI should be disclosed."

    **What the student can't do:** Actually disclose. The policy doesn't say where (a note at the end, a cover statement, a comment to you, a form), when (with submission or before), or what to include. It could mean naming the tool, describing the purpose, listing the prompts, or marking which parts were affected. A first-year has no convention to fall back on.

    **Your decision:** What does a sufficient disclosure contain, and where does it go? You don't need a template unless you want one, but you do need to say what's enough.

    ### 4. Whether disclosing protects the student

    > "Any use of AI should be disclosed. Work that is substantially produced by AI will not receive credit and may be referred as an academic integrity violation."

    **What the student can't do:** Predict what happens after an honest disclosure. Read together, these sentences mean a student who uses AI heavily and says so may still get zero credit and an integrity referral. That gives them a reason to hide the use, which works against the disclosure requirement. The student also can't tell where "substantially" begins, so they can't judge whether a given disclosure puts them at risk.

    **Your decision:** Does disclosure change the outcome? For example, is disclosed overuse treated as a grading matter and undisclosed overuse as an integrity matter? Or are they treated the same? Separately, what does "substantially produced" mean?

    […]

    ---

    The central decision is the fourth one. Until you decide whether disclosure protects a student, the other answers won't make students willing to disclose. Once you've made these calls, I can revise the text to reflect them.

- id: policy-briefed
  session: editorial-assistant
  label: "Three places a reader gets lost"
  run: "briefed: editorial-brief filled as in the note, syllabus-policy.txt pasted above it, new chat"
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "The brackets were filled in as: a syllabus policy, for undergraduates in a history course, trying to set expectations about AI use that students can actually follow; worried about what counts as disclosure and whether the policy can be enforced; don't change voice or terminology. The policy was pasted above the prompt. Nothing is cut."
  text: |
    Here are the three places a student is most likely to get lost, in order of how much trouble they'll cause:

    **1. "Any use of AI should be disclosed."**

    This is the sentence you're worried about, and students will be too. It leaves three questions open:
    - **What counts as "use."** Is Grammarly AI? The AI summary at the top of a Google search? Autocomplete in Word or Docs? Asking a chatbot to explain a term from the reading? Students will draw the line in very different places, and most will draw it narrowly.
    - **What disclosure looks like.** A footnote, a sentence at the end, the full chat transcript, a note on the submission form? Without a format, two students who used AI the same way will disclose it very differently, or not at all.
    - **What "should" means.** Elsewhere the policy uses consequence language ("will not receive credit"). Here "should" reads as a recommendation, not a requirement, so a student could reasonably think skipping disclosure is a minor lapse rather than a violation.

    **2. "Students may use generative AI tools in this course where appropriate, but should not use them to complete assignments for them."**

    The policy opens by granting permission, then limits it with two phrases that carry the whole meaning but aren't defined. "Where appropriate" doesn't say who decides or by what standard. "Complete assignments for them" is clear at the extremes, like pasting in the prompt and submitting the output, but undergraduates live in the middle. Brainstorming a thesis, outlining, summarizing a primary source, rephrasing a paragraph they wrote: a student can't tell from this sentence whether any of those is "completing" the assignment. The closing line ("I expect students to use their judgment") puts the burden back on the same judgment this sentence fails to inform.

    **3. "Work that is substantially produced by AI will not receive credit and may be referred as an academic integrity violation."**

    "Substantially" is the threshold for the most serious consequence in the policy, and a reader can't locate it. Is it a share of the words? The ideas? The structure? The sentence also doesn't say how you would determine it, which is your enforcement concern.

    It also creates a problem with the disclosure sentence. A student who honestly discloses heavy AI use seems to be reporting their own lost credit, and possibly an integrity referral. A careful reader will notice that disclosure is risky and non-disclosure is hard to detect. The policy doesn't say whether disclosure changes how "substantially produced" work is treated, so it quietly rewards silence.

    (Separately, "referred as an academic integrity violation" reads as if a word is missing, perhaps "referred *for review* as" or "treated as." Students may stumble on it, though it won't confuse them the way the three above will.)

- id: policy-vague
  session: editorial-assistant
  label: "An open follow-up"
  run: "briefed: policy-open-followup, same chat"
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "Sent next in the same chat. Nothing is cut."
  text: |
    Beyond the three main problems, a few smaller things are worth checking.

    **"If you are unsure whether a particular use is permitted, ask before submitting."**
    "Before submitting" suggests asking once the work is done, when the AI use has already happened. If you want students to ask before *using* a tool, the sentence points them to the wrong moment. It also doesn't say whom to ask or how (you, a TA, office hours, email). That matters if you want a record of the answer.

    **The policy applies uniformly to the whole course.**
    "In this course" makes it one rule for everything. If any assignments differ, such as an in-class exam, a reading response, or a research paper, students will assume the same allowance applies to all of them. If you plan to tighten or loosen it per assignment, the syllabus should tell them to expect that.

    **Nothing says how you'll decide a case.**
    For enforceability, this may matter more than any wording. The policy gives consequences but no process. Students don't know whether you might ask for drafts, notes, version history, or chat logs, or ask them to talk through their work. If you plan to use any of these, saying so up front makes them fair to use later and encourages students to keep that material. If you plan to use AI detectors, students should know that too. Detectors are unreliable enough that relying on them without notice invites disputes.

    **"Students are responsible for the accuracy of everything they submit."**
    This sentence is clear and useful. In a history course, though, the main accuracy risk is fabricated sources, quotations, and citations. Students may not connect "accuracy" to "the book this cites may not exist." Consider whether you want that risk named, since it's where students most often get caught off guard.

    **Tools students may not think of as optional.**
    Translation tools, grammar checkers, and assistive technology fall into the gray zone of "any use." Multilingual students and students with accommodations may read the policy as restricting tools they rely on. They may not ask, because they don't see those tools as "AI."

    **Tone versus consequences.**
    The last sentence ("support learning rather than to prohibit technology") is generous, but it follows a sentence about integrity referrals. Some students will read the warmth as the real message and the penalty as boilerplate, and some will read it the other way. This isn't a wording flaw. It's worth knowing which reading you want to win, because that shapes how seriously students take the disclosure requirement.

