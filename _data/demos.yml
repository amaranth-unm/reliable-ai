    All changes are within the "Eight of the 32 people" paragraph. Bracketed text marks facts only you know.

    1. **Current:** "the time required to review a transcript"
       **Replace with:** "the time required to read a transcript and check its description"
       **Why:** The paragraph opens with contributors reviewing "their descriptions" but then attributes the burden to reviewing "a transcript." This wording assumes that checking a description meant reading the transcript. If it didn't, change "transcript" to "description" instead.

    2. **Current:** "uncertainty about what could be changed"
       **Replace with:** "uncertainty about what could be changed, which would mean the options described above were not made clear to contributors"
       **Why:** Paragraph 2 lists exactly what contributors can change. Without this, the paragraph appears to contradict that list rather than admit a communication gap.

    3. **Current:** "Their comments led us to revise several place names and distinguish a remembered event from a date established in another source."
       **Replace with:** "Their comments led us to revise several place names and distinguish a remembered event from a date established in another source. [We accepted all of the suggested changes. / We declined N suggestions because ___.]"
       **Why:** Paragraph 2 says the team makes final decisions after consultation, and paragraph 4 says it will document unresolved disagreements. Reporting only accepted changes leaves the reader no sense of how consultation worked or whether any disagreements exist.

    4. **Current:** "We cannot yet tell which explanation matters most."
       **Replace with:** "We cannot yet tell which explanation matters most; the library sessions described below will test whether contributors prefer to discuss revisions in person."
       **Why:** As written, the paragraph raises a question the draft never takes up again. This links it to the next phase without changing paragraph 4.

    5. **Current:** "Making the collection searchable is therefore only one part of making it usable."
       **Replace with:** "Gathering the materials in one searchable place did not by itself give contributors a practical way to take part in describing them."
       **Why:** "Therefore" presents the original sentence as a conclusion from the evidence on low participation, but that evidence is about contributor involvement, not usability. The replacement states what the evidence actually shows.

    Two conflicts from my earlier read are left alone because they sit outside this paragraph: paragraph 2's "facilitated the comparison of records by contributors" and paragraph 4's "The pilot shows that digital access strengthens community ownership." Your revised paragraph will still be in tension with both.

