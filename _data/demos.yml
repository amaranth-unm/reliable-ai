  text: |
    ## Transparent Design Review: Campus History, Part 2

    This review covers only the supplied snapshot (Sept 23, 2026). Part 1 and the linked student publishing guide aren’t included, so anything they might explain is marked as outside the materials, not as a gap.

    ### Purpose

    **Clear.** The assignment names three skills and explains each: structural analysis (“how institutions... shape what knowledge survives and what gets lost”), reading for absence (“What would the AI never know because it was never digitized?”), and source criticism (“who created this document, why, and what can (and can’t) it tell us?”). The “intellectual goal” is stated plainly: “find out what the historical record actually says about your topic and compare it to what the AI told you.” The audience framing, “a curious reader... who knows nothing about its history,” and the real publication venue give the work a purpose beyond the classroom.

    **Partly explained.** The text says what the skills are but not why they matter beyond this course, for instance why comparing AI output to archives is a useful habit. It also doesn’t say how each skill appears in the essay itself. “Source criticism” is a named skill, yet nothing in the task or the requirements asks students to do it in the essay.

    ### Task

    **Clear.** Logistics are concrete and sequenced: what to bring (pencil, phone, AI critique), where to go, how to check in, how to find and request boxes (“about 10 minutes”), and what to photograph versus scan. The requirements are countable: “~800–1000 words,” “4–5 images,” “Informative captions on every image,” “Subheadings,” and a “Bibliography,” with the standard “specify exactly where you found something so it can be verified.” The research tips (“Names change,” “You’re not searching full text”) anticipate real obstacles. The division of labor between this guide (what to argue and document) and the Campus History guide (how to publish) is explicit.

    **Partly explained.**

    - The task says to “reshape your AI essay into a UNM Campus History essay, that fuses both the AI essay and your own findings.” What “fuses” looks like (revising the draft, quoting it, discussing it separately) is not stated.
    - The publishing section says what the page needs to “argue, document, and reflect on for class,” but “reflect” has no corresponding instruction.
    - The submission mechanism is deferred to the student guide (“submitting a pull request”). That seems a reasonable handoff, but no deadline appears in this document.

    **Not stated.** No due date, and no instruction on where the AI-Archive Comparison goes or how long it should be.

    ### Criteria

    **Clear.** The A–F descriptors are specific, and the weak-submission list is helpful (“Could have been written without visiting the archive”; a generic comparison like “AI can sometimes be inaccurate”). The priority is stated honestly: “primarily on effort and intellectual engagement, not writing polish or whether you found spectacular archival material.” That reassurance is a real strength, since archives don’t always cooperate.

    **Partly explained.**

    - Evidence of engagement is named (“specific sources cited, real images scanned, notes that reflect actual digging”), but “notes” aren’t requested anywhere in the task or submission.
    - “A readable story with a point, even if a modest one” is a criterion, but the task only says “Think about the story you want to tell” as a tip.
    - The B and C descriptors rely on terms like “mostly specific” and “thin” without examples.

    **Not stated.** Relative weighting of components. I’m not inferring any, since none is supplied.

    ### Task–criteria alignment check

    | Graded component | Introduced in task? |
    | --- | --- |
    | Archival evidence, specific sources, bibliography | Yes |
    | Images with substantive captions | Yes (“not just what it shows, but why it’s significant”) |
    | Readable narrative with a point | Lightly (a tip, plus “Style”) |
    | **AI-Archive Comparison** | **No.** It appears only in the criteria. |
    | **Notes** as evidence | **No** |
    | Source criticism, reading for absence | Named as skills, but not requested in any deliverable |

    ### Three priority clarifications

    1. **Where does the AI-Archive Comparison live, and what is it?** It is central to the A-level criteria (“quotes the draft directly and names concrete differences”) yet is never listed under Requirements or the essay instructions. Is it a section of the published essay, a separate submission, or covered by “reflect on for class”? Does it count toward the 800–1000 words?
    2. **How should students demonstrate the named skills?** Reading for absence and source criticism are stated purposes, but no deliverable asks for them. A sentence connecting them to the essay or comparison (for example, whether captions or the comparison should address who made a source and what’s missing) would make the purpose visible in the work.
    3. **What exactly gets submitted, and are notes included?** The criteria cite “notes that reflect actual digging,” but the task never asks for them, and the submission is described only through the external guide. Clarifying the full set of items and the deadline (if not in the guide) would let students see how effort will be recognized.

