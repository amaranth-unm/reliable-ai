# Demonstrations — real replies from real runs.
#
# The counterpart to prompts.yml. A prompt is what the reader pastes; a demo
# is what actually came back when we ran it. Rendered with:
#
#     {% include demo.html id="policy-baseline" %}
#
# RULES, and the first one is not negotiable:
#
# 1. Never write `text` from memory, from imagination, or by editing a reply
#    into what you wish it had said. The session's whole claim is that the
#    reader can check everything on the page. An invented transcript is the
#    one mistake that cannot be walked back.
# 2. Always fill `tool` and `date`. Models change; an unlabelled transcript
#    silently stops being true. The date is when the reply was generated.
# 3. Trimming is allowed, faking is not. If a reply is long, cut it and mark
#    the cut with […]. Never reorder, never tidy the grammar, never merge two
#    runs into one.
# 4. If a re-run gives something materially different, replace the demo and
#    move the date. That is the demonstration still being true, not a defeat —
#    and "we re-ran this in March and it no longer flattered us" is itself
#    worth a sentence on the page.
#
# An entry with an empty `text` renders as a loud red unfilled slot, so a
# half-finished demonstration cannot ship looking finished.
#
# These recorded examples use the syllabus policy from practice-texts.md.
# The separate community-archive style-guide exercise has prepared teaching
# examples, labeled as such on the page, rather than recorded replies here.
#
# ---------------------------------------------------------------------------
# PROVENANCE OF THIS FIRST SET, and its one real weakness.
#
# These replies were generated by Claude (Opus 5) on 2026-09-22, in the
# authoring session that built this page. They are verbatim — nothing has been
# improved, reordered, or written to fit the argument.
#
# But they were produced in a conversation that had already discussed what
# each prompt is supposed to demonstrate, and that is a live risk of the
# result being flattered by the context it was generated in. They are a seed
# set, not a finding. Re-run them in a clean chat window, in whichever tool
# the room will actually use, and replace these — and if a clean run behaves
# differently, that difference is more interesting than anything here.
#
# Where a run did NOT do what the page predicted, the page has been changed to
# match the run. See policy-baseline, which is the useful example.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------- strategy 1
- id: policy-baseline
  session: editorial-assistant
  strategy: 1
  label: "Asked with no context: “Edit this.”"
  run: 'Archived prompt: "Edit this." The current baseline prompt is different.'
  tool: "Claude Opus 5"
  date: "2026-09-22"
  note: "Archived reply to the earlier prompt 'Edit this.' Retained for provenance; it is not a response to the current clarity-and-concision prompt."
  text: |
    Here's a cleaner version:

    > **Use of AI Tools.** You may use generative AI tools in this course
    > where appropriate, but not to complete assignments for you. Any use of
    > AI must be disclosed. Work that is substantially produced by AI will not
    > receive credit and may be referred for investigation as an academic
    > integrity violation. You are responsible for the accuracy of everything
    > you submit. If you are unsure whether a particular use is permitted, ask
    > before submitting. The goal of this policy is to support learning, not
    > to prohibit technology, and I expect you to use your judgment.

    What I changed:

    - **Person.** Moved to second person throughout. The original mixes
      "Students may…" with "If you are unsure…", and a syllabus is addressed
      to the student reading it.
    - **"should" → "must."** "Any use of AI should be disclosed" states a
      preference where the rest of the paragraph states requirements.
    - **"referred as" → "referred for investigation as."** The original is
      missing a word.
    - **Comma before "not to prohibit technology"** for parallelism.

    Let me know if you'd like it tightened further or pitched more formally.

# ---------------------------------------------------------------- strategy 1
- id: policy-briefed
  session: editorial-assistant
  strategy: 1
  label: "The same paragraph, briefed"
  run: 'prompt id="editorial-brief"'
  tool: "Claude Opus 5"
  date: "2026-09-22"
  note: "Brief filled in as: a syllabus policy, for undergraduates in a history course, trying to set expectations students can actually follow; worried about enforceability and about what counts as disclosure; don't change voice or terminology."
  text: |
    Three places a reader is most likely to get lost:

    **1.** > "Students may use generative AI tools in this course where
    appropriate"

    "Where appropriate" is the whole policy in three words, and it is the
    three words that don't say anything. A student who wants to comply has no
    way to determine appropriateness from this sentence, and the paragraph
    never comes back to define it. Everything after this point assumes the
    reader already knows.

    **2.** > "Work that is substantially produced by AI will not receive
    credit"

    "Substantially" is a threshold with no number, no proportion and no
    example. A student who used AI to reorganise an outline and then wrote
    every sentence themselves cannot tell which side of this they are on — and
    on this text, neither can you. It is also the sentence with the penalty
    attached, so it is where the ambiguity costs most.

    **3.** > "Any use of AI should be disclosed."

    Disclosed how, to whom, in what form? A footnote, a cover note, an
    appendix listing prompts? The sentence creates an obligation and specifies
    no way to discharge it, so a conscientious student either over-discloses
    or guesses.

    On your two worries: enforceability and disclosure are the same problem
    here. Both rest on "substantially," and until that word names a test,
    neither you nor the student can apply it consistently.

# ---------------------------------------------------------------- strategy 2
- id: policy-vague
