    **One change from the New Mexico version:** the page doesn't contain your data. When it opens, it asks you to pick or drag in `us-county-population-2020-2024.csv`. Copying all 3,144 rows into the page by hand could have introduced typos you'd never notice, and browsers won't let a page open a file next to it on its own. If you'd rather have everything in one file, I can do that, but I'd need a way to copy the data automatically.

    The file is […]

    ## Matching failures I expect
    I read the whole table. It has 3,144 county rows for the 50 states and DC, plus 51 state-total rows, which I left out. The codes are all current:
    - Connecticut uses its nine planning regions (09110–09190).
    - Alaska has Chugach (02063) and Copper River (02066).
    - The renamed counties are there: Kusilvak (02158) and Oglala Lakota (46102).
    - Bedford city, Virginia (absorbed into Bedford County in 2013) is gone, as it should be.

    So I expect:
    - **Table rows with no boundary match:** none.
    - **Boundaries with no table match:** probably all in Puerto Rico (78 municipios) and possibly the island areas: American Samoa 5, Guam 1, Northern Mariana Islands 4, U.S. Virgin Islands 3. That depends on what the Census service includes, which I couldn't check. These aren't errors: the Census Bureau's national county file covers only the 50 states and DC. They also fall outside this kind of U.S. map, so they wouldn't be drawn anyway.

    The page explains the common causes itself when it sees them. The most likely one is Connecticut, if old boundaries meet new codes or the reverse. Others it recognises are past Alaska, South Dakota, Virginia and Florida code changes, and missing territories. Anything else gets flagged as unexplained, to check for typos or lost leading zeros.

    ## Measure
    Same as before: percent change from `POPESTIMATE2020` to `POPESTIMATE2024`, both July 1 estimates.

    ## Color classes
    There are eight classes split evenly around zero, with breaks at −10, −5, −2, 0, 2, 5 and 10%. The values run much wider than in New Mexico, from about −20% (Garza County, TX) to over +30% (Kaufman County, TX). Most counties sit within a few points of zero, so the classes are narrow near zero and wider at the ends. That shows detail where most counties are without hiding the extremes. Zero is still a dividing line, so gain versus loss reads at a glance. I avoided equal-count (quantile) classes for the same reason as before: their breaks would be odd numbers that are hard to read. The legend shows how many counties fall in each class, and the range and median.

    […]

    ## Projection
    I used the standard U.S. Albers equal-area projection, with Alaska and Hawaii in their own boxes. An equal-area projection keeps county sizes true within each part of the map. One trade-off: **Alaska is shown at about 35% of the main map's scale**, so its boroughs look smaller than they really are. The note on the page says so.

    […]

    ## Risks
    - I took the Census service addresses from memory and haven't tested them. If both fail, the page lets you load a county boundary file from your computer instead.
    - The boundaries are simplified to about 500 m. Very small areas, such as some of Virginia's independent cities, may show up as tiny slivers, and an extremely small one could disappear.

