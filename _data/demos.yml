- id: style-extract-run
  session: editorial-assistant
  label: "A style sheet from three passages"
  run: "style-sheet: seminar-paragraph.txt, abstract.txt and archive-report.txt pasted above the prompt, new chat"
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "Sent with three practice texts standing in for your own writing, so the reply's first move is to notice that they aren't by one writer. Sections 1, 3 and 4 are cut."
  text: |
    # Style sheet for editing this author

    **Before using it:** the three passages don't share one style. The Arroyo Memory Project report (passage 3, four paragraphs) has a consistent, distinctive voice. The Rio Grande paragraph (passage 1) is close to it but more generic. The public health abstract (passage 2) is written in a different register entirely. The rules below are based on passage 3, which shows the voice most clearly. Where passages 1 or 2 depart from it, I note it. If passage 2 is the voice you want, most of these rules should be reversed.

    ---

    […]

    ## 2. Hedging and qualification

    - Hedge by giving reasons, not by adding softening words. The model is the sentence listing three possible explanations for low response, followed by an admission that the author can't yet choose among them. Keep this pattern. Don't replace it with "may perhaps suggest."
    - State uncertainty plainly and in the first person ("We cannot yet tell"). Don't turn it into the passive ("It remains unclear whether").
    - Check every concluding claim against the evidence in the same passage. This author's main risk is a confident final sentence that outruns the data. **Fix in passage 3:** "The pilot shows that digital access strengthens community ownership" contradicts the earlier report that only 8 of 32 contributors responded and that the reasons are unknown. Change it to something like "The pilot suggests that digital access can support community ownership…"
    - Also check claims against each other. "Ensuring that community members retain control" conflicts with "Final decisions… are made by the project team." Ask the author which is true. Don't smooth over the conflict.
    - Passage 1 hedges with "This suggests" and "Some have argued… others have suggested." Passage 2 doesn't hedge at all ("demonstrates"). Neither is the target voice.

    […]

    ## 5. Habits the author may not have noticed

    - **Triplets.** Lists of three appear in every passage: "work, migration, and neighborhood change"; "suggest corrections, add context, or request…"; "time…, uncertainty…, or a preference…"; "municipal records, professional correspondence, and popular ephemera." Keep them where all three items carry weight. Cut to two where the third is filler, and break up any paragraph with more than one triplet.
    - **A recurring "who" question.** Passages 1 and 3 both turn on who has authority: "who counted as a legitimate claimant," "who gets to describe them," "whose words appear on the screen." This is the author's real subject. Protect these sentences, and don't let them be repeated in the same wording across sections.
    - **Broadening final sentences.** Every passage ends by widening the stakes ("for the next century," "persist in contemporary public health infrastructures," "remain unfinished"). Allow one per section. Check that each is earned by what came before.
    - **Lapses into an agentless, bureaucratic voice**, mostly in planning and methods sentences: "Additional contextual information will be incorporated where appropriate." Rewrite these with a subject and a specific condition ("We will add context when contributors supply it").
    - **Inconsistent punctuation.** Passage 3 uses curly quotes and passage 2 uses straight ones. Passage 1 uses a spaced em dash. Standardize to whatever the house style requires.

    […]

    If you tell me which passage is closest to the voice you're aiming for, I can tighten this into a shorter checklist, or apply it to one of the passages to test it.

- id: style-never-run
  session: editorial-assistant
  label: "The never-do list, added"
  run: "style-sheet: style-never, same chat"
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "Sent next in the same chat. The last of the three revised rules is cut."
  text: |
    Here is the new section, followed by three existing rules I've revised so they don't contradict it.

    ## 6. Never do this

    - **Never remove a hedge.** If a claim is qualified, the qualification is doing work. You may *add* a qualification where a claim outruns the evidence (see §2), but flag it as a suggestion and don't delete or weaken an existing one.
    - **Never replace the author's terminology with more common synonyms.** Keep terms like "shared stewardship," "acequia associations," "contributors," and "description" exactly as written. If a term seems unclear, query it in a comment rather than substituting another word.
    - **Never add transitions like "Moreover," "Furthermore," "Additionally," or "In addition" to cover a gap between sentences.** If two sentences don't connect, flag the gap and leave it for the author to resolve.
    - **Never use an em dash to join two independent clauses.** Use a period or a semicolon. Em dashes are acceptable only before a phrase that can't stand alone as a sentence, as in passage 1 ("— a shift that would shape the region's politics…").
    - **Never open with a compliment.** Start directly with the first substantive comment. Don't add praise, softening, or a summary of strengths before or after the edits.

    ---

    ### Revised rules

    **§3, theory vocabulary.** The original rule told the editor to strike and replace terms like "interrogates" and "technology of governance," which now conflicts with the terminology rule. Revised:

    > Query, don't replace, vocabulary like "interrogates," "discursive construction," and "technology of governance." Ask the author whether the term is doing specific work in this piece. If it is, leave it.

    **§3, throat-clearing.** The original rule said to cut passage 1's first two sentences. The second ("Some have argued… while others have suggested a more complicated picture") is a qualification, so cutting it would remove a hedge. Revised:

    > Flag generic openings ("has been addressed by numerous scholars") and ask the author to name the scholars or positions. Don't cut sentences that set out competing views; those are qualifications.

    […]

- id: working-file-run
  session: editorial-assistant
  label: "One paragraph, read against the rest"
  run: "working-file: archive-report.txt pasted above, section filled as the paragraph beginning \"Eight of the 32 people\", new chat"
  tool: "Claude Opus 5.5 in Claude Code, fresh session"
  date: "2026-11-11"
  note: "The whole report was pasted above the prompt, with the third paragraph named as the section. Nothing is cut."
  text: |
    ## Repeats

    - **"Eight of the 32 people interviewed"** restates the count from paragraph 1 ("recorded 32 interviews"). Repeating it to give the ratio is reasonable, but it is a repeat.
    - **"Making the collection searchable is therefore only one part of making it usable"** echoes paragraph 1's "easier to find and use." That works as a callback, but "therefore" presents it as a conclusion from this paragraph's evidence. The preceding sentences are about why contributors didn't review, not about whether the collection is usable. The link isn't established.

    ## Contradicts or sits in tension with surrounding text

    - **"uncertainty about what could be changed"** vs. paragraph 2, which says contributors "can suggest corrections, add context, or request that an interview remain unavailable online." Paragraph 2 presents the contributor's role as clearly defined. This sentence suggests it wasn't clear to contributors. Both can be true, but the draft doesn't acknowledge the gap.
    - **"reviewed their descriptions"** vs. **"the time required to review a transcript."** Within your own paragraph, it's unclear whether contributors reviewed descriptions (the subject of paragraph 2's "common description template") or transcripts. These are different burdens.
    - **"Eight of the 32... reviewed their descriptions"** vs. paragraph 2's **"facilitated the comparison of records by contributors."** Your paragraph describes contributors each reviewing their own description, not comparing records. Paragraph 4 then lists comparison as a future plan: "invite contributors to compare descriptions together." Your paragraph's evidence doesn't support the claim that comparison already happened.
    - **"The limited response... We cannot yet tell which explanation matters most"** vs. paragraph 4's **"The pilot shows that digital access strengthens community ownership of local history."** Your paragraph reports low participation and an unexplained cause. The conclusion claims the pilot demonstrated a positive effect. This is the sharpest conflict.

    ## Sets up something never delivered

    - **"We cannot yet tell which explanation matters most."** This raises an open question, but paragraph 4 never says the next phase will try to answer it. The library sessions may address "a preference for discussing revisions in person," but the draft doesn't make that connection. It also doesn't mention the other two explanations (time, uncertainty about what could be changed) again.
    - **"Their comments led us to revise..."** reports only accepted changes. Paragraph 2 says "Final decisions... are made by the project team after consultation," and paragraph 4 says "unresolved disagreements will be documented." Your paragraph doesn't say whether any pilot comments were declined or disputed. As a result, the reader has no basis for knowing that disagreements exist or how consultation worked in practice.

- id: no-silent-edits-run
  session: editorial-assistant
  label: "A list of changes instead of a file"
