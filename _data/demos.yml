    2. **“Virtual Museums and Public Engagement in the Digital Age,” 2023:** listed under Conferences and Invited Workshops with the same venue and city. One event or two? Both entries stay until you confirm.
    3. **Borderlands Memory Mapping Initiative / Borderlands Memory Atlas:** same project or different ones?
