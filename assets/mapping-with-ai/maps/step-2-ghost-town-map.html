<script>
(function () {
  // Minimal RFC 4180 CSV parser (quoted fields, "" escapes, commas/newlines inside quotes).
  function parseCSV(text) {
    var rows = [], row = [], field = '', inQuotes = false, i = 0, c;
    while (i < text.length) {
      c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // Strip only the single newline at the start and end of the embedded data block.
  var raw = document.getElementById('csv-data').textContent.replace(/^\n/, '').replace(/\n$/, '');
  var table = parseCSV(raw);
  var header = table[0];
  var records = table.slice(1).map(function (r) {
    var o = {};
    header.forEach(function (h, idx) { o[h] = r[idx] !== undefined ? r[idx] : ''; });
    return o;
  });

  // Colors are assigned per status, compared case-insensitively so that
  // "Abandoned site" and "Abandoned Site" share a color. Displayed text is never altered.
  var palette = {
    'historic site':       '#1f77b4',
    'abandoned site':      '#d62728',
    'semi-abandoned site': '#ff7f0e',
    'barren site':         '#8c564b',
    'neglected site':      '#9467bd',
    'submerged':           '#17becf'
  };
  var noStatusColor = '#9e9e9e';
  var extraColors = ['#2ca02c', '#e377c2', '#bcbd22', '#7f7f7f'];
  function statusKey(s) { return s.toLowerCase(); }
  function colorFor(s) {
    if (s === '') return noStatusColor;
    var k = statusKey(s);
    if (!palette[k]) palette[k] = extraColors.shift() || '#000000';
    return palette[k];
  }

  var map = L.map('map');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  function popupContent(r) {
    var dl = document.createElement('dl');
    dl.className = 'popup';
    [['Name', 'name'], ['Other names', 'other_names'], ['County', 'county'],
     ['Settled', 'settled'], ['Abandoned', 'abandoned'], ['Status', 'status'],
     ['GNIS ID', 'gnis_id']].forEach(function (pair) {
      var dt = document.createElement('dt'); dt.textContent = pair[0];
      var dd = document.createElement('dd');
      if (r[pair[1]] === '') { dd.textContent = 'not given'; dd.className = 'empty'; }
      else { dd.textContent = r[pair[1]]; }
      dl.appendChild(dt); dl.appendChild(dd);
    });
    return dl;
  }

  var located = [], unlocated = [];
  var legendGroups = {}; // key -> {color, labels: [original spellings]}
  records.forEach(function (r) {
    if (r.latitude !== '' && r.longitude !== '') located.push(r); else unlocated.push(r);
  });

  var latlngs = [];
  located.forEach(function (r) {
    var ll = [parseFloat(r.latitude), parseFloat(r.longitude)];
    latlngs.push(ll);
    var color = colorFor(r.status);
    var key = r.status === '' ? '' : statusKey(r.status);
    if (!legendGroups[key]) legendGroups[key] = { color: color, labels: [], count: 0 };
    if (r.status !== '' && legendGroups[key].labels.indexOf(r.status) === -1) legendGroups[key].labels.push(r.status);
    legendGroups[key].count++;
    L.circleMarker(ll, {
      radius: 7, color: '#222', weight: 1, fillColor: color, fillOpacity: 0.9
    }).bindPopup(popupContent(r)).bindTooltip(r.name).addTo(map);
  });
  if (latlngs.length) map.fitBounds(latlngs, { padding: [30, 30] });
  else map.setView([34.5, -106], 6);

  var legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    var div = L.DomUtil.create('div', 'legend');
    var title = document.createElement('strong'); title.textContent = 'Status';
    div.appendChild(title);
    Object.keys(legendGroups).sort(function (a, b) {
      if (a === '') return 1; if (b === '') return -1; return a < b ? -1 : 1;
    }).forEach(function (k) {
      var g = legendGroups[k];
      var line = document.createElement('div');
      var sw = document.createElement('span'); sw.className = 'swatch'; sw.style.background = g.color;
      line.appendChild(sw);
      line.appendChild(document.createTextNode(
        (k === '' ? 'No status in table' : g.labels.join(' / ')) + ' (' + g.count + ')'));
      div.appendChild(line);
    });
    return div;
  };
  legend.addTo(map);

  var tbody = document.querySelector('#unlocated tbody');
  unlocated.forEach(function (r) {
    var tr = document.createElement('tr');
    ['name', 'county', 'match_note'].forEach(function (f) {
      var td = document.createElement('td');
      if (r[f] === '') { td.textContent = 'not given'; td.className = 'empty'; }
      else td.textContent = r[f];
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  document.getElementById('summary').textContent =
    records.length + ' towns in the CSV: ' + located.length + ' mapped from GNIS coordinates, ' +
    unlocated.length + ' without coordinates (listed below the map). Click a point for details.';
})();
</script>
